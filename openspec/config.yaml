schema: spec-driven

context: |
  项目是车险续保助手，采用 Node.js 24、TypeScript、pnpm workspace、React、Vite 和 Fastify。
  根 AGENTS.md 是 Agent 操作入口，docs/engineering/ai-workflow.md 是完整工程流程。
  docs/features/<feature-name>.md 与 OpenSpec capability/spec 目录名一致。
  docs/testing/<change-name>.md 保存当前 change 的测试计划与实际证据。
  docs/arch 维护整体架构，具体图源和渲染产物放在 artifacts。
  新增或变更中间件、依赖、框架、工具或服务时更新 docs/tech；第三方服务对接细节更新 docs/impl。
  OpenSpec tasks 是迭代任务状态的唯一清单，代码和实际测试结果是实现状态的事实来源。

rules:
  proposal:
    - 每个 capability 使用稳定的 kebab-case 名称，并对应 docs/features/<capability>.md；在 proposal 中列出或链接受影响的需求文档。
    - 明确范围、非目标、外部服务、依赖与文档影响；纯工具或文档变更使用 skip_specs，不虚构产品 requirement。
  specs:
    - capability 目录名必须与 docs/features 下对应需求文件名一致，每个 requirement 至少包含一个可测试 scenario。
  design:
    - 说明架构、技术资料、第三方对接和测试计划需要更新的文件；新增依赖时给出版本、使用位置和验证方式。
  tasks:
    - 将 features、testing、tech、impl、arch 及 artifacts 的必要同步工作写入 tasks，并为每项任务写明验证方式。
    - 实现任务必须包含或关联测试；最后包含运行文档检查和更新 docs/testing/<change-name>.md 实际证据的任务。

operations:
  apply:
    guidance:
      - 开始前阅读对应 feature、当前 change、测试计划和直接相关的 arch、tech、impl 文档。
      - 每完成一项任务立即更新 tasks；测试未实际运行时不得记录为通过。
      - 依赖、服务或架构发生变化时，在同一 change 内同步对应文档和 artifacts。
  archive:
    guidance:
      - 归档前确认当前实现版本已有测试计划要求的通过证据；可复用未受变化影响的结果。归档后重新运行 docs:check、format:check 和 OpenSpec 校验。
      - 确认 docs/testing/<change-name>.md 已记录实际结果和证据，所有未完成项均未被误勾选。
      - 同步主 specs 后归档，并把 feature 与 testing 文档中的活动 change 链接更新为归档路径。
